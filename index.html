<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hopscotch Lane</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5c5a7;color:#342a27}
#game{height:100vh;overflow:hidden;position:relative}

/* TOWN */
#town{position:absolute;inset:0;background:#a9d98b}
.road1,.road2{position:absolute;background:#888}
.road1{left:0;right:0;top:45%;height:110px}
.road2{top:0;bottom:0;left:45%;width:110px}
.road1:after{content:"";position:absolute;left:0;right:0;top:52px;border-top:5px dashed #ffe79b}
.road2:after{content:"";position:absolute;top:0;bottom:0;left:52px;border-left:5px dashed #ffe79b}

/* PLACES */
.place{
  position:absolute;
  width:130px;
  height:100px;
  border:4px solid #6c5549;
  border-radius:18px;
  background:#fff4df;
  text-align:center;
  font-weight:bold;
  font-size:16px;
  padding-top:25px;
  box-shadow:0 4px 7px #0003;
  cursor:pointer;
}
.place:active{transform:scale(.96)}

#home{left:5%;top:7%;background:#ffdcca}
#shop{right:5%;top:7%;background:#fff0b8}
#kitchen{left:5%;bottom:8%;background:#ffe8d4}
#park{right:5%;bottom:8%;background:#d8f2bd}
#job{left:42%;top:16%;background:#dceaff}

/* PLAYER */
#player{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  border:4px solid white;
  background:#ff6f91;
  left:50%;
  top:55%;
  transform:translate(-50%,-50%);
  z-index:3;
  box-shadow:0 4px 8px #0004;
}
#player:after{
  content:"★";
  color:white;
  position:absolute;
  font-size:23px;
  left:9px;
  top:6px;
}

/* CONTROLS */
#controls{
  position:absolute;
  z-index:8;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:58px 58px 58px;
  grid-template-rows:58px 58px;
  gap:5px;
}
.ctrl{
  border:0;
  border-radius:15px;
  background:white;
  font-size:24px;
  box-shadow:0 3px 7px #0004;
}
.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}

/* MENU */
#menu{
  position:absolute;
  right:12px;
  top:15px;
  z-index:8;
  border:0;
  border-radius:12px;
  background:white;
  padding:9px 13px;
  font-weight:bold;
  box-shadow:0 3px 7px #0003;
}

/* MODAL */
#modal{
  display:none;
  position:absolute;
  inset:0;
  background:#0007;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.panel{
  background:white;
  border-radius:22px;
  width:min(450px,95vw);
  max-height:88vh;
  overflow:auto;
  padding:22px;
  text-align:center;
}
.panel h2{margin-top:0}
button.action{
  display:block;
  width:100%;
  margin:7px 0;
  padding:13px;
  border:0;
  border-radius:13px;
  background:#ffd2df;
  font-size:16px;
  font-weight:bold;
}
button.close{background:#ddd}
.row{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}
.choice{
  padding:10px;
  border:2px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}
#toast{
  display:none;
  position:absolute;
  z-index:30;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:11px 17px;
  border-radius:14px;
  box-shadow:0 3px 8px #0004;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

  <div id="town">

    <div class="road1"></div>
    <div class="road2"></div>

    <div id="home" class="place" onclick="openHome()">
      🏠<br>My Home
    </div>

    <div id="shop" class="place" onclick="openShop()">
      🛍️<br>Market
    </div>

    <div id="kitchen" class="place" onclick="openKitchen()">
      🍳<br>Kitchen
    </div>

    <div id="park" class="place" onclick="openPark()">
      🌳<br>Park
    </div>

    <div id="job" class="place" onclick="openJobs()">
      💼<br>Jobs
    </div>

    <div id="player"></div>

  </div>

  <button id="menu" onclick="openMenu()">☰</button>

  <div id="controls">
    <button class="ctrl up" onclick="move(0,-1)">▲</button>
    <button class="ctrl left" onclick="move(-1,0)">◀</button>
    <button class="ctrl down" onclick="move(0,1)">▼</button>
    <button class="ctrl right" onclick="move(1,0)">▶</button>
  </div>

  <div id="toast"></div>

  <div id="modal">
    <div class="panel" id="panel"></div>
  </div>

</div>

<script>
let coins=1200;
let gameMinutes=480;
let x=50,y=55;
let inventory=[];
let character={
  skin:"#f2c29b",
  hair:"#3b2417",
  shirt:"#ff6f91",
  pants:"#5865a8"
};

/* SAVE */
function save(){
  localStorage.setItem(
    "hopscotchLane",
    JSON.stringify({
      coins,
      gameMinutes,
      inventory,
      character
    })
  );
}

/* LOAD */
function load(){
  let s=localStorage.getItem("hopscotchLane");

  if(s){
    try{
      let d=JSON.parse(s);

      coins=d.coins??1200;
      gameMinutes=d.gameMinutes??480;
      inventory=d.inventory??[];
      character=d.character??character;

    }catch(e){}
  }

  update();
}

/* UPDATE */
function update(){
  document.getElementById("player").style.left=x+"%";
  document.getElementById("player").style.top=y+"%";
  document.getElementById("player").style.background=character.shirt;
}

/* GAME CLOCK
   1 real minute = 8 game minutes
*/
setInterval(()=>{
  gameMinutes+=8/60;
  save();
},1000);

/* COINS */
function addCoins(n){
  coins+=n;
  save();
}

/* MOVEMENT */
function move(dx,dy){
  x=Math.max(4,Math.min(96,x+dx*4));
  y=Math.max(7,Math.min(94,y+dy*4));
  update();
}

document.addEventListener("keydown",e=>{
  if(e.key=="ArrowUp"||e.key.toLowerCase()=="w")move(0,-1);
  if(e.key=="ArrowDown"||e.key.toLowerCase()=="s")move(0,1);
  if(e.key=="ArrowLeft"||e.key.toLowerCase()=="a")move(-1,0);
  if(e.key=="ArrowRight"||e.key.toLowerCase()=="d")move(1,0);
});

/* MODAL */
function modal(html){
  document.getElementById("panel").innerHTML=html;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* MESSAGE */
function toast(t){
  let a=document.getElementById("toast");
  a.textContent=t;
  a.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    a.style.display="none";
  },2200);
}

/* HOME */
function openHome(){
  modal(`
    <h2>🏠 My Home</h2>

    <p>Welcome home!</p>

    <button class="action" onclick="editCharacter()">
      👤 Edit Character
    </button>

    <button class="action" onclick="showInventory()">
      🎒 Inventory
    </button>

    <button class="action close" onclick="closeModal()">
      Close
    </button>
  `);
}

/* CHARACTER */
function editCharacter(){
  modal(`
    <h2>👤 Character Creator</h2>

    <p><b>Skin</b></p>

    <div class="row">
      <button class="choice" onclick="setSkin('#f2c29b')">Light</button>
      <button class="choice" onclick="setSkin('#c6865a')">Tan</button>
      <button class="choice" onclick="setSkin('#75452d')">Brown</button>
    </div>

    <p><b>Hair</b></p>

    <div class="row">
      <button class="choice" onclick="setHair('#3b2417')">Brown</button>
      <button class="choice" onclick="setHair('#111')">Black</button>
      <button class="choice" onclick="setHair('#d9b04c')">Blonde</button>
    </div>

    <p><b>Shirt</b></p>

    <div class="row">
      <button class="choice" onclick="setShirt('#ff6f91')">Pink</button>
      <button class="choice" onclick="setShirt('#5c8dff')">Blue</button>
      <button class="choice" onclick="setShirt('#63c174')">Green</button>
      <button class="choice" onclick="setShirt('#9a62d9')">Purple</button>
    </div>

    <p><b>Pants</b></p>

    <div class="row">
      <button class="choice" onclick="setPants('#5865a8')">Blue</button>
      <button class="choice" onclick="setPants('#444')">Black</button>
      <button class="choice" onclick="setPants('#d58b4d')">Brown</button>
    </div>

    <button class="action close" onclick="closeModal()">
      Done
    </button>
  `);
}

function setSkin(c){
  character.skin=c;
  save();
  toast("Skin changed!");
}

function setHair(c){
  character.hair=c;
  save();
  toast("Hair changed!");
}

function setShirt(c){
  character.shirt=c;
  update();
  save();
  toast("Shirt changed!");
}

function setPants(c){
  character.pants=c;
  save();
  toast("Pants changed!");
}

/* SHOP */
function openShop(){
  modal(`
    <h2>🛍️ Hopscotch Market</h2>

    <p>Coins: 🪙 ${Math.floor(coins).toLocaleString()}</p>

    <button class="action" onclick="buy('Bread',35)">🍞 Bread — 35</button>
    <button class="action" onclick="buy('Apple',25)">🍎 Apple — 25</button>
    <button class="action" onclick="buy('Milk',30)">🥛 Milk — 30</button>
    <button class="action" onclick="buy('Eggs',45)">🥚 Eggs — 45</button>
    <button class="action" onclick="buy('Flour',40)">🌾 Flour — 40</button>

    <button class="action" onclick="buy('Backpack',150)">🎒 Backpack — 150</button>
    <button class="action" onclick="buy('Skateboard',300)">🛹 Skateboard — 300</button>
    <button class="action" onclick="buy('Bicycle',500)">🚲 Bicycle — 500</button>
    <button class="action" onclick="buy('Lamp',120)">💡 Lamp — 120</button>
    <button class="action" onclick="buy('Plant',80)">🪴 Plant — 80</button>

    <button class="action close" onclick="closeModal()">Close</button>
  `);
}

function buy(item,price){
  if(coins<price){
    toast("Not enough coins!");
    return;
  }

  coins-=price;
  inventory.push(item);

  save();

  toast(item+" bought! 🎉");
}

/* COOKING */
function openKitchen(){
  modal(`
    <h2>🍳 Kitchen</h2>

    <p>Buy ingredients at the Market, then cook!</p>

    <button class="action" onclick="cook('Toast',['Bread'],60)">
      🍞 Make Toast
    </button>

    <button class="action" onclick="cook('Apple Pie',['Apple','Bread'],120)">
      🥧 Make Apple Pie
    </button>

    <button class="action" onclick="cook('Pancakes',['Flour','Eggs','Milk'],180)">
      🥞 Make Pancakes
    </button>

    <button class="action" onclick="cook('Breakfast',['Eggs','Bread','Milk'],200)">
      🍳 Make Breakfast
    </button>

    <button class="action close" onclick="closeModal()">Close</button>
  `);
}

function cook(name,ingredients,reward){

  let copy=[...inventory];

  for(let item of ingredients){

    let index=copy.indexOf(item);

    if(index===-1){
      toast("You need "+ingredients.join(", ")+"!");
      return;
    }

    copy.splice(index,1);
  }

  inventory=copy;
  inventory.push(name+" 🍽️");

  addCoins(reward);

  toast(name+" cooked! +🪙 "+reward);
}

/* JOBS */
function openJobs(){
  modal(`
    <h2>💼 Jobs</h2>

    <p>Choose a job.</p>

    <button class="action" onclick="job('Delivery',90)">
      📦 Delivery — +90
    </button>

    <button class="action" onclick="job('Gardening',75)">
      🌱 Gardening — +75
    </button>

    <button class="action" onclick="job('Cafe',110)">
      ☕ Cafe — +110
    </button>

    <button class="action" onclick="job('Town Helper',140)">
      🏘️ Town Helper — +140
    </button>

    <button class="action close" onclick="closeModal()">Close</button>
  `);
}

function job(name,reward){
  addCoins(reward);
  toast(name+" completed! +🪙 "+reward);
}

/* PARK */
function openPark(){
  modal(`
    <h2>🌳 Park</h2>

    <p>Have some fun!</p>

    <button class="action" onclick="parkGame()">
      🎯 Find Coins
    </button>

    <button class="action" onclick="parkGame()">
      🪁 Play
    </button>

    <button class="action close" onclick="closeModal()">
      Leave Park
    </button>
  `);
}

function parkGame(){
  let reward=Math.floor(Math.random()*41)+10;

  addCoins(reward);

  toast("You found 🪙 "+reward+"!");
}

/* INVENTORY */
function showInventory(){
  modal(`
    <h2>🎒 Inventory</h2>

    <p>
      ${inventory.length
        ? inventory.join(" • ")
        : "Your inventory is empty."}
    </p>

    <button class="action close" onclick="closeModal()">
      Close
    </button>
  `);
}

/* MENU */
function openMenu(){
  modal(`
    <h2>🏘️ Hopscotch Lane</h2>

    <p>🪙 ${Math.floor(coins).toLocaleString()} coins</p>
    <p>🕐 Game time is running!</p>

    <button class="action" onclick="editCharacter()">
      👤 Character
    </button>

    <button class="action" onclick="showInventory()">
      🎒 Inventory
    </button>

    <button class="action" onclick="bonus()">
      🎁 Daily Bonus
    </button>

    <button class="action" onclick="resetGame()">
      🔄 New Game
    </button>

    <button class="action close" onclick="closeModal()">
      Close
    </button>
  `);
}

/* BONUS */
function bonus(){

  let today=new Date().toDateString();

  if(localStorage.getItem("hopscotchBonus")==today){
    toast("Bonus already collected today!");
    return;
  }

  localStorage.setItem("hopscotchBonus",today);

  addCoins(250);

  closeModal();

  toast("Daily bonus! +🪙 250");
}

/* RESET */
function resetGame(){

  if(!confirm("Start a new Hopscotch Lane game?"))return;

  coins=1200;
  gameMinutes=480;
  inventory=[];
  x=50;
  y=55;

  character={
    skin:"#f2c29b",
    hair:"#3b2417",
    shirt:"#ff6f91",
    pants:"#5865a8"
  };

  localStorage.removeItem("hopscotchLane");
  localStorage.removeItem("hopscotchBonus");

  update();
  closeModal();

  toast("New game started! 🎉");
}

load();
</script>

</body>
</html>
